<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Hotel - Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:900px;
    text-align:center;
}

h1{
    color:white;
    font-size:40px;
    margin-bottom:10px;
}

p{
    color:#ddd;
    margin-bottom:40px;
    font-size:18px;
}

.options{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.card{
    width:300px;
    height:300px;
    background:white;
    border-radius:20px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
    transition:.4s;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.icon{
    font-size:70px;
    margin-bottom:20px;
}

.card h2{
    color:#333;
    margin-bottom:15px;
}

.card p{
    color:#555;
    font-size:16px;
    margin-bottom:25px;
}

.btn{
    text-decoration:none;
    background:#ff9800;
    color:white;
    padding:12px 30px;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#e68900;
}
</style>

</head>
<body>

<div class="container">

<h1>Welcome to Fortune Hotel</h1>

<p>Please choose one of the services below</p>

<div class="options">

<div class="card">
<div class="icon">🍽️</div>
<h2>Dine In</h2>
<p>Reserve a table and enjoy delicious food.</p>
<a href="dinein.html" class="btn">Dine In</a>
</div>

<div class="card">
<div class="icon">🏨</div>
<h2>Room Booking</h2>
<p>Book luxurious rooms with the best facilities.</p>
<a href="rooms.html" class="btn">Book Room</a>
</div>

</div>

</div>

</body>
</html>
