<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Hotel | Dine In</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(to right,#141E30,#243B55);
color:white;
}

header{
background:#000;
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
letter-spacing:2px;
}

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{
font-size:45px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#ddd;
}

.container{
width:90%;
max-width:900px;
margin:40px auto;
background:white;
color:black;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.container h2{
text-align:center;
margin-bottom:30px;
color:#243B55;
}

form{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.full{
grid-column:1/3;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
resize:none;
height:120px;
}

button{
width:100%;
padding:15px;
background:#ff9800;
color:white;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#e68900;
}

footer{
margin-top:50px;
padding:20px;
background:#000;
text-align:center;
color:white;
}

@media(max-width:768px){

form{
grid-template-columns:1fr;
}

.full{
grid-column:1;
}

.hero h1{
font-size:35px;
}

}

</style>

</head>
<body>

<header>
FORTUNE HOTEL
</header>

<section class="hero">
<h1>🍽️ Dine In Reservation</h1>
<p>Reserve your table and enjoy an unforgettable dining experience.</p>
</section>

<div class="container">

<h2>Book Your Table</h2>

<form action="#">

<div>
<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>
</div>

<div>
<label>Mobile Number</label>
<input type="tel" placeholder="Enter mobile number" required>
</div>

<div>
<label>Email Address</label>
<input type="email" placeholder="Enter email">
</div>

<div>
<label>Date</label>
<input type="date" required>
</div>

<div>
<label>Time</label>
<input type="time" required>
</div>

<div>
<label>Number of Guests</label>
<select required>
<option>Select</option>
<option>1 Person</option>
<option>2 Persons</option>
<option>3 Persons</option>
<option>4 Persons</option>
<option>5 Persons</option>
<option>6 Persons</option>
<option>7 Persons</option>
<option>8 Persons</option>
<option>More than 8</option>
</select>
</div>

<div class="full">
<label>Seating Preference</label>
<select>
<option>No Preference</option>
<option>Indoor</option>
<option>Outdoor</option>
<option>Window Side</option>
<option>Family Area</option>
<option>Private Dining</option>
</select>
</div>

<div class="full">
<label>Special Requests</label>
<textarea placeholder="Birthday celebration, anniversary, wheelchair access, etc."></textarea>
</div>

<div class="full">
<button type="submit" href="payment.html" class="btn">Reserve Table</button>
</div>

</form>

</div>

<footer>
© 2026 Fortune Hotel | Fine Dining Experience
</footer>

</body>
</html>
