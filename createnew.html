<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Fortune Hotel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
}

.signup-box{
    width:420px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 0 30px rgba(255,215,0,0.3);
    text-align:center;
}

.signup-box h1{
    color:#FFD700;
    margin-bottom:10px;
}

.signup-box p{
    color:white;
    margin-bottom:25px;
}

.input-box{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    outline:none;
    border-radius:30px;
    font-size:16px;
}

.btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:30px;
    background:#FFD700;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:white;
    transform:scale(1.05);
    box-shadow:0 0 20px #FFD700;
}

.footer{
    margin-top:20px;
    color:white;
}

.footer a{
    color:#FFD700;
    text-decoration:none;
    font-weight:bold;
}

.footer a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="signup-box">

    <h1>Fortune Hotel</h1>
    <p>Create Your Account</p>

    <form action="login.html">

        <input type="text" class="input-box" placeholder="Full Name" required>

        <input type="email" class="input-box" placeholder="Email Address" required>

        <input type="tel" class="input-box" placeholder="Mobile Number" required>

        <input type="text" class="input-box" placeholder="Username" required>

        <input type="password" class="input-box" placeholder="Password" required>

        <input type="password" class="input-box" placeholder="Confirm Password" required>

        <button type="submit" class="btn">
            Create Account
        </button>

    </form>

    <div class="footer">
        Already have an account?<br><br>
        <a href="login.html">Login Here</a>
    </div>

</div>

</body>
</html>
